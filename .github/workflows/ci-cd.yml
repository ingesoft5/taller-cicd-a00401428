name: CI/CD Pipeline - Product Application

# ==============================================================================
# TALLER EVALUATIVO: AUTOMATIZACION CI/CD (INGENIERIA DE SOFTWARE V - ICESI)
# ==============================================================================

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ----------------------------------------------------------------------------
  # JOB 1: VALIDACION Y PRUEBAS UNITARIAS BACKEND
  # ----------------------------------------------------------------------------
  test-backend:
    name: Backend Unit Tests & Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Maven Tests and Package
        working-directory: ./backend
        run: mvn clean package

      - name: Upload Backend JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar

  # ----------------------------------------------------------------------------
  # JOB 2: VALIDACION Y COMPILACION FRONTEND
  # ----------------------------------------------------------------------------
  test-frontend:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm install

      - name: Run Linter
        working-directory: ./frontend
        run: npm run lint

      - name: Build Application
        working-directory: ./frontend
        run: npm run build

  # ----------------------------------------------------------------------------
  # JOB 3: CONSTRUCCION DE IMAGENES DOCKER (MULTI-STAGE)
  # ----------------------------------------------------------------------------
  build-docker:
    name: Build Multi-Stage Docker Images
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ----------------------------------------------------------------------------
  # JOB 4: DESPLIEGUE LOCAL Y PRUEBA DE HUMO (SMOKE TEST)
  # ----------------------------------------------------------------------------
  smoke-test:
    name: Compose Up & Smoke Testing
    needs: [build-docker]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy Local Stack
        run: docker compose up -d --build

      - name: Wait and Validate API (Smoke Test)
        run: |
          echo "Esperando a que la API esté disponible..."
          # Reintenta la conexión 12 veces, con un descanso de 5 segundos (máximo 60s)
          for i in {1..12}; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/products || echo "000")
            if [ "$HTTP_STATUS" -eq 200 ]; then
              echo "Smoke test exitoso! Respuesta HTTP $HTTP_STATUS."
              exit 0
            fi
            echo "Intento $i: Código HTTP $HTTP_STATUS. Reintentando en 5 segundos..."
            sleep 5
          done
          echo " Smoke test fallido: El servicio no respondió con HTTP 200 a tiempo."
          exit 1

      - name: Tear Down Containers
        if: always() # Asegura que se apaguen incluso si falla el smoke test
        run: docker compose down