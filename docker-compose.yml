version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: springboot-backend
    ports:
      - "8080:8080"
    networks:
      - app-network
    # Healthcheck verificando el endpoint específico solicitado
    healthcheck:
      # Alpine Linux usa wget por defecto (no curl)
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8080/api/products || exit 1"]
      interval: 15s      # Cada cuánto se hace la prueba
      timeout: 5s        # Cuánto espera a que responda la petición
      retries: 5         # Cuántas veces falla antes de marcarlo "unhealthy"
      start_period: 20s  # Tiempo de gracia para que la JVM de Spring Boot inicie

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: react-frontend
    ports:
      - "80:80"
    networks:
      - app-network
    depends_on:
      backend:
        condition: service_healthy # Espera explícitamente a que el healthcheck pase

networks:
  app-network:
    driver: bridge